name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the release runs these before it builds the app
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install Cairn and its test tools
        run: uv sync --locked --extra test
      - name: Run the Python tests
        run: .venv/bin/python -m unittest discover -s tests

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install Cairn and its test tools
        run: uv sync --locked --extra test
      - name: Run the Python tests
        run: .venv\Scripts\python -m unittest discover -s tests
      - name: Start the installed command
        run: uv tool run --from . cairn --help

  javascript:
    name: JavaScript
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run the JavaScript tests
        run: node --test tests/js/*.mjs
