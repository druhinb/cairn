name: Feature request
description: An idea for something Cairn could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or problem, in your own words. Say what you do today instead.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A rough idea is fine.
